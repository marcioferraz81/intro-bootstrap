<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdução Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark " style="background-color: #10A0B1;">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Logo da empresa</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="bi bi-house-fill"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contato.html">
                            <i class="bi bi-envelope-fill"></i> Contato
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-3">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Página Inicial</a></li>
                <li class="breadcrumb-item active" aria-current="page">Contato</li>
            </ol>
        </nav>

        <!--formulário-->
        <form>

            <div class="mb-3">
                <label for="txtnome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="txtnome" minlength="10" maxlength="50" placeholder="Seu nome aqui">
            </div>

            <div class="mb-3">
                <label for="txtdata" class="form-label">Data de nascimento</label>
                <input type="date" class="form-control" id="txtdata">
            </div>

            <div class="mb-3">
                <label for="txtidade" class="form-label">Idade</label>
                <input type="number" class="form-control" id="txtidade" min="5" max="70" placeholder="Idade aqui" step="1">
            </div>

            <div class="mb-3">
                <label for="txtsalario" class="form-label">Salário</label>
                <input type="number" class="form-control" id="txtsalario" min="1600" placeholder="Salário aqui" step="0.01">
            </div>

            <div class="mb-3">
                <label for="txtemail" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="txtemail" aria-describedby="emailHelp" placeholder="Seu email aqui">
                <div id="emailHelp" class="form-text">descrição da caixa.</div>
            </div>
            <div class="mb-3">
                <label for="txtsenha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="txtsenha">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">Check me out</label>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
